        let map, markers = {}, selectedMarket = null, sidebarExpanded = false;

        // Initialize Map with Mobile Settings
        function initMap() {
            console.log('🗺️ Initializing map...');


            map = L.map('map', {
                zoomControl: true,
                attributionControl: true,
                dragging: true,
                tap: true,
                touchZoom: true,
                scrollWheelZoom: true,
                doubleClickZoom: true,
                boxZoom: true,
                keyboard: true
            }).setView([50.9375, 6.9603], 13);

            console.log('✅ Map created with zoom controls');
            console.log('📱 Touch zoom enabled:', map.options.touchZoom);
            console.log('🖱️ Scroll wheel zoom enabled:', map.options.scrollWheelZoom);
            console.log('🔍 Zoom level:', map.getZoom());

            // Move zoom control to top left (separate from locate button)
            map.zoomControl.setPosition('topleft');

            // Live OpenStreetMap standard tiles, no API key. Respect the OSM tile policy.
            const baseLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors',
                maxZoom: 19
            }).addTo(map);
            let tileErrorCount = 0;
            baseLayer.on('tileerror', () => {
                tileErrorCount += 1;
                if (tileErrorCount === 3) document.getElementById('mapNotice').hidden = false;
            });
            baseLayer.on('tileload', () => { document.getElementById('mapNotice').hidden = true; tileErrorCount = 0; });

            // Enable dragging after map loads
            setTimeout(() => {
                map.dragging.enable();
            }, 100);

            // Add markers
            MARKETS.forEach(market => {
                const icon = L.divIcon({
                    html: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#e11d48" width="42" height="42" style="filter: drop-shadow(3px 3px 3px rgba(0,0,0,0.6));"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>`,
                    className: '',
                    iconSize: [42, 42],
                    iconAnchor: [21, 21]
                });

                const marker = L.marker([market.lat, market.lon], { icon })
                    .addTo(map)
                    .bindPopup(createPopupContent(market), {
                        maxWidth: 300,
                        className: 'mobile-popup'
                    });

                marker.on('click', () => selectMarket(market.id));
                markers[market.id] = marker;
                if (!market.source) map.removeLayer(marker);
            });

            refreshMarkets();
            fetchWeather();
        }

        // Create Mobile-Optimized Popup
        function createPopupContent(market) {
            return `
                <div class="w-full text-stone-200">
                    ${market.image ? `<img src="${market.image}" alt="${market.name}" class="w-full h-40 object-cover rounded-t-lg" loading="lazy" onerror="this.hidden=true" />` : ''}
                    <div class="p-4">
                        <h3 class="text-lg font-bold mb-2 text-amber-400" style="font-family: 'Cinzel', serif;">
                            ${market.name}
                        </h3>
                        <p class="text-xs text-amber-300 mb-2">📍 ${market.stadtteil}</p>
                        <p class="text-sm text-stone-300 mb-3">${market.desc}</p>
                        <div class="text-xs text-stone-400 space-y-1">
                            <p><strong>Adresse:</strong> ${market.ort}</p>
                            <p><strong>Zeitraum:</strong> ${marketPeriod(market)}</p>
                            <p><strong>Öffnung:</strong> ${market.hours}</p>
                            ${market.note ? `<p class="text-amber-300">${market.note}</p>` : ''}
                            <p>Stand: ${market.checked}. Standort ungefähr.</p>
                            ${market.source ? `<p><a href="${market.source}" target="_blank" rel="noopener" class="underline text-amber-300">Quelle für 2026 prüfen</a></p>` : '<p class="text-amber-300">Kein bestätigter Termin für 2026.</p>'}
                        </div>
                        ${market.website ? `<a href="${market.website}" target="_blank" rel="noopener" class="inline-block mt-3 text-xs text-amber-400 hover:text-amber-300 underline">→ Webseite</a>` : ''}
                    </div>
                </div>
            `;
        }

        function marketPeriod(market) {
            return market.source ? `${market.start} bis ${market.end}` : 'Termin 2026 noch nicht bestätigt';
        }
        function visibleMarkets() {
            return MARKETS.filter(m => m.source || document.getElementById('showUnconfirmed').checked);
        }
        function refreshMarkets() {
            const visible = new Set(visibleMarkets().map(m => m.id));
            MARKETS.forEach(m => {
                if (visible.has(m.id)) { if (!map.hasLayer(markers[m.id])) markers[m.id].addTo(map); }
                else map.removeLayer(markers[m.id]);
            });
            document.getElementById('marketCount').textContent = `${MARKETS.filter(m => m.source).length} Standorte mit Termin 2026, ${MARKETS.filter(m => !m.source).length} noch unbestätigt`;
            renderMarketList();
        }
        // Render Mobile-Optimized List
        function renderMarketList() {
            const listHtml = visibleMarkets().map(market => `
                <div onclick="selectMarket(${market.id})"
                     class="touch-target p-5 border-b border-black/20 active:bg-stone-700/70 transition-colors border-l-4 border-transparent"
                     id="market-item-${market.id}"
                     >
                    <h3 class="font-semibold text-lg text-stone-200">${market.name}${market.added ? ' <span class="text-xs text-amber-300">Neu in der Karte</span>' : ''}</h3>
                    <div class="text-sm text-stone-400 mt-1">
                        <p>${market.ort}</p>
                        <p class="text-xs mt-1">${marketPeriod(market)}</p>
                    </div>
                </div>
            `).join('');

            document.getElementById('marketList').innerHTML = listHtml;
        }

        // Select Market
        function selectMarket(id) {
            selectedMarket = id;
            const market = MARKETS.find(m => m.id === id);

            if (market) {
                map.setView([market.lat, market.lon], 15);
                setTimeout(() => markers[id].openPopup(), 300);

                // Update selection
                document.querySelectorAll('[id^="market-item-"]').forEach(el => {
                    el.classList.remove('bg-amber-900/40', 'border-amber-400');
                    el.classList.add('border-transparent');
                });

                const item = document.getElementById(`market-item-${id}`);
                if (item) {
                    item.classList.add('bg-amber-900/40', 'border-amber-400');
                    item.classList.remove('border-transparent');
                }

                // Close sidebar
                sidebarExpanded = false;
                updateSidebarState();
            }
        }

        // Toggle Sidebar
        function toggleSidebar() {
            sidebarExpanded = !sidebarExpanded;
            updateSidebarState();
        }

        function updateSidebarState() {
            const sidebar = document.getElementById('sidebar');
            const icon = document.getElementById('toggleIcon');
            const hint = document.getElementById('sidebarHint');

            if (sidebarExpanded) {
                sidebar.classList.remove('collapsed');
                sidebar.classList.add('expanded');
                icon.style.transform = 'rotate(180deg)';
                hint.textContent = 'Tippen zum Schließen';
            } else {
                sidebar.classList.remove('expanded');
                sidebar.classList.add('collapsed');
                icon.style.transform = 'rotate(0deg)';
                hint.textContent = 'Tippen zum Öffnen';
            }
        }

        // Locate User with Better Mobile Support
        function locateUser(btn) {
            if (!navigator.geolocation) {
                alert('Standortdienste werden nicht unterstützt');
                return;
            }

            btn.innerHTML = '<div class="loading"></div>';

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;

                    map.setView([lat, lon], 14);

                    L.marker([lat, lon], {
                        icon: L.divIcon({
                            html: '<div style="width:20px;height:20px;background:#38bdf8;border:3px solid white;border-radius:50%;box-shadow:0 0 10px rgba(56,189,248,0.8);"></div>',
                            className: '',
                            iconSize: [20, 20]
                        })
                    }).addTo(map).bindPopup('Ihr Standort');

                    btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/></svg>';
                },
                (error) => {
                    alert('Standort konnte nicht ermittelt werden. Bitte Standortdienste in den Einstellungen aktivieren.');
                    btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/></svg>';
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        // Fetch Weather
        function fetchWeather() {
            fetch('https://api.open-meteo.com/v1/forecast?latitude=50.94&longitude=6.96&current=temperature_2m,weather_code')
                .then(res => res.json())
                .then(data => {
                    const temp = Math.round(data.current.temperature_2m);
                    const icon = getWeatherIcon(data.current.weather_code);

                    document.getElementById('weather').innerHTML = `
                        <div class="flex items-center justify-between text-stone-300">
                            <div class="flex items-center gap-3">
                                <div class="text-4xl">${icon}</div>
                                <div class="text-left">
                                    <p class="font-bold text-base text-stone-200">Köln</p>
                                    <p class="text-sm">${getWeatherDesc(data.current.weather_code)}</p>
                                </div>
                            </div>
                            <div class="text-2xl font-bold text-amber-400" style="font-family: 'Cinzel', serif;">
                                ${temp}°C
                            </div>
                        </div>
                    `;
                })
                .catch(() => {
                    document.getElementById('weather').innerHTML = '<p class="text-rose-400 text-sm">Wetter nicht verfügbar</p>';
                });
        }

        function getWeatherIcon(code) {
            if (code === 0) return '☀️';
            if (code < 4) return '⛅';
            if (code < 50) return '☁️';
            if (code < 70) return '🌧️';
            if (code < 80) return '❄️';
            return '⛈️';
        }

        function getWeatherDesc(code) {
            if (code === 0) return 'Klar';
            if (code < 4) return 'Teilweise bewölkt';
            if (code < 50) return 'Nebel';
            if (code < 70) return 'Regen';
            if (code < 80) return 'Schnee';
            return 'Gewitter';
        }

        // Initialize on load
        window.addEventListener('load', initMap);

        // Handle Orientation Changes
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                map.invalidateSize();
            }, 100);
        });

        // Handle Resize
        window.addEventListener('resize', () => {
            map.invalidateSize();
        });
    </script>
</body>
</html>
