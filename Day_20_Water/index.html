<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cologne Flood Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href='https://unpkg.com/maplibre-gl@4.1.0/dist/maplibre-gl.css' rel='stylesheet' />
    <style>
      /* Custom scrollbar for report panel */
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      /* Map container must have height */
      #map {
        height: 100%;
        width: 100%;
        z-index: 0;
      }
      /* Pulse animation for live indicator */
      @keyframes pulse-red {
        0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
        70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
        100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
      }
      .animate-pulse-ring {
        animation: pulse-red 2s infinite;
      }

      /* MapLibre Attribution customization */
      .maplibregl-ctrl-attrib {
        background-color: rgba(30, 41, 59, 0.8) !important;
        backdrop-filter: blur(4px);
      }
      .maplibregl-ctrl-attrib a {
        color: #94a3b8 !important;
      }
      /*
      .maplibregl-popup-content {
        background: transparent !important;
        padding: 0 !important;
        box-shadow: none !important;
      }
       .maplibregl-popup-anchor-bottom .maplibregl-popup-tip {
        border-top-color: #f8fafc !important;
      }
      .maplibregl-popup-anchor-top .maplibregl-popup-tip {
        border-bottom-color: #dc2626 !important;
      }
      */
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",

    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "@turf/turf": "https://esm.sh/@turf/turf@6.5.0",
    "maplibre-gl": "https://esm.sh/maplibre-gl@4.1.0",
    "react-map-gl": "https://esm.sh/react-map-gl@7.1.7?external=react,react-dom",
    "react-dom/": "https://aistudiocdn.com/react-dom@18.2.0/"
  }
}
</script>

</html>
