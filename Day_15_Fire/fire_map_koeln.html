<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Feuerwehr Köln · Response Coverage Explorer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fonts & Leaflet -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    :root {
      --bg: #050915;
      --panel-bg: rgba(13, 20, 38, 0.9);
      --panel-border: rgba(255, 255, 255, 0.08);
      --accent: #ff6b4a;
      --accent-soft: #ffb347;
      --text: #f4f6fb;
      --muted: #8d9bb7;
      --input-bg: rgba(12, 18, 35, 0.8);
      --input-border: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top, rgba(255, 153, 0, 0.18), transparent 60%),
        radial-gradient(circle at 20% 20%, rgba(255, 61, 0, 0.25), transparent 55%),
        var(--bg);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at bottom right, rgba(83, 168, 255, 0.25), transparent 35%);
      pointer-events: none;
      z-index: 0;
    }

    .app-shell {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100%;
      filter: saturate(1.05);
    }

    .panel {
      position: absolute;
      top: 28px;
      left: 28px;
      width: min(380px, calc(100% - 48px));
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 22px;
      padding: 24px;
      backdrop-filter: blur(18px);
      box-shadow: 0 25px 40px rgba(5, 9, 21, 0.55);
      z-index: 500;
    }

    .panel-header {
      display: flex;
      gap: 12px;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.7);
      margin: 0;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      margin: 4px 0;
    }

    .subtitle {
      margin: 0;
      font-size: 14px;
      color: var(--muted);
    }

    .badge {
      background: rgba(255, 255, 255, 0.1);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 12px;
    }

    .stat-label {
      font-size: 12px;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .stat-value {
      display: block;
      margin-top: 6px;
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
    }

    .panel-controls label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      color: rgba(255, 255, 255, 0.85);
    }

    .panel-controls select,
    .panel-controls input[type="range"] {
      width: 100%;
      border-radius: 14px;
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      color: var(--text);
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
      margin-bottom: 14px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .panel-controls select:focus,
    .panel-controls input[type="range"]:focus {
      border-color: rgba(255, 107, 74, 0.6);
      box-shadow: 0 0 0 3px rgba(255, 107, 74, 0.2);
    }

    input[type="range"] {
      appearance: none;
      height: 40px;
      padding: 12px 0;
      background: transparent;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 6px;
      background: linear-gradient(90deg, var(--accent), var(--accent-soft));
      border-radius: 3px;
    }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 18px;
      height: 18px;
      background: #fff;
      border-radius: 50%;
      border: 2px solid var(--accent);
      margin-top: -6px;
      box-shadow: 0 6px 15px rgba(255, 107, 74, 0.4);
    }

    input[type="range"]::-moz-range-track {
      height: 6px;
      background: linear-gradient(90deg, var(--accent), var(--accent-soft));
      border-radius: 3px;
    }

    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      background: #fff;
      border-radius: 50%;
      border: 2px solid var(--accent);
      box-shadow: 0 6px 15px rgba(255, 107, 74, 0.4);
    }

    .range-label {
      margin-top: -10px;
      margin-bottom: 14px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }

    .toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
    }

    .toggle input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    .detail-card {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 16px;
      margin-top: 6px;
      min-height: 92px;
    }

    .detail-card h3 {
      margin: 0 0 4px;
      font-size: 16px;
      color: var(--text);
    }

    .detail-card p {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }

    .detail-meta {
      display: block;
      margin-top: 6px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 12px;
    }

    .legend {
      background: rgba(13, 20, 38, 0.92);
      border-radius: 16px;
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 18px 30px rgba(5, 9, 21, 0.45);
      color: var(--text);
      font-size: 13px;
    }

    .legend-title {
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: 0.01em;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .legend-color {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.35);
    }

    .legend-color.red { background: rgba(255, 78, 80, 0.65); }
    .legend-color.orange { background: rgba(255, 145, 77, 0.65); }
    .legend-color.yellow { background: rgba(255, 210, 77, 0.65); }

    .leaflet-control-layers {
      border-radius: 16px;
      background: rgba(13, 20, 38, 0.92);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 12px 24px rgba(4, 6, 12, 0.4);
    }

    .leaflet-control-zoom a {
      background: rgba(13, 20, 38, 0.92);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .leaflet-popup-content-wrapper {
      border-radius: 16px;
      background: rgba(13, 20, 38, 0.95);
      color: var(--text);
      box-shadow: 0 20px 40px rgba(2, 6, 23, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .leaflet-popup-tip {
      background: rgba(13, 20, 38, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      border-left: 1px solid rgba(255, 255, 255, 0.08);
    }

    .fire-marker {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      width: 38px;
      height: 38px;
      position: relative;
    }

    .fire-marker .marker-body {
      width: 32px;
      height: 32px;
      border-radius: 12px;
      background: linear-gradient(135deg, #ff6b4a, #ffb347);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 18px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 15px 30px rgba(255, 107, 74, 0.35);
      transform: translateY(4px);
    }

    .fire-marker .marker-pulse {
      position: absolute;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(255, 107, 74, 0.4);
      animation: pulse 2.8s infinite;
      bottom: -4px;
      z-index: -1;
    }

    @keyframes pulse {
      0% { transform: scale(0.5); opacity: 0.8; }
      70% { transform: scale(1.6); opacity: 0; }
      100% { opacity: 0; }
    }

    @media (max-width: 820px) {
      .panel {
        width: calc(100% - 48px);
      }
    }

    @media (max-width: 640px) {
      .panel {
        left: 50%;
        transform: translateX(-50%);
        top: 18px;
        width: calc(100% - 32px);
        padding: 20px;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .badge {
        font-size: 11px;
      }
    }

    @media (max-width: 420px) {
      .panel {
        padding: 18px;
      }

      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="map"></div>
    <section class="panel" id="infoPanel">
      <div class="panel-header">
        <div>
          <p class="eyebrow">Day 15 · Fire</p>
          <h1>Feuerwehr Köln</h1>
          <p class="subtitle">Response-Zonen & Einsatzgebiete</p>
        </div>
        <div class="badge">#30DayMapChallenge</div>
      </div>
      <div class="stats">
        <div class="stat">
          <span class="stat-label">Stationen</span>
          <span class="stat-value" id="stationCount">--</span>
        </div>
        <div class="stat">
          <span class="stat-label">Rettung</span>
          <span class="stat-value" id="ambulanceCount">--</span>
        </div>
        <div class="stat">
          <span class="stat-label">Letzte Daten</span>
          <span class="stat-value" id="datasetDate">--</span>
        </div>
      </div>
      <div class="panel-controls">
        <label for="stationSelect">Station finden</label>
        <select id="stationSelect">
          <option value="">Station auswählen …</option>
        </select>

        <label for="operatorFilter">Betreiber filtern</label>
        <select id="operatorFilter">
          <option value="all">Alle Betreiber</option>
        </select>

        <label for="radiusSlider">Response-Zonen skalieren</label>
        <input id="radiusSlider" type="range" min="0.6" max="1.4" step="0.1" value="1" />
        <div class="range-label">
          <span>Kompakt</span>
          <span id="radiusValue">100%</span>
          <span>Maximal</span>
        </div>

        <label class="toggle">
          <input type="checkbox" id="coverageToggle" checked />
          Response-Zonen anzeigen
        </label>
      </div>
      <div class="detail-card">
        <h3 id="detailName">Station auswählen</h3>
        <p id="detailAddress">Suche oder klicke auf eine Wache, um Adresse und Betreiber zu sehen.</p>
      </div>
    </section>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    const map = L.map("map", {
      center: [50.94, 6.96],
      zoom: 12,
      zoomControl: false,
      preferCanvas: true
    });

    const voyager = L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap Mitwirkende &copy; CARTO"
    }).addTo(map);

    const noir = L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap Mitwirkende &copy; CARTO"
    });

    const pastel = L.tileLayer("https://tile.openstreetmap.fr/hot/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap Mitwirkende &copy; HOT OSM"
    });

    L.control.zoom({ position: "topright" }).addTo(map);
    L.control.scale({ imperial: false, position: "bottomleft" }).addTo(map);

    const stationsGroup = L.featureGroup().addTo(map);
    const coverageGroup = L.layerGroup().addTo(map);

    const baseMaps = {
      "CARTO Voyager": voyager,
      "CARTO Nacht": noir,
      "HOT Humanitarian": pastel
    };

    const overlayMaps = {
      "Feuerwachen": stationsGroup,
      "Response-Zonen": coverageGroup
    };

    L.control.layers(baseMaps, overlayMaps, { collapsed: true, position: "topright" }).addTo(map);

    const panelEl = document.getElementById("infoPanel");
    L.DomEvent.disableScrollPropagation(panelEl);
    L.DomEvent.disableClickPropagation(panelEl);

    const responseConfig = [
      { minutes: 5, radius: 2000, color: "#ff4e50", label: "ca. 5 Min." },
      { minutes: 10, radius: 4000, color: "#ff914d", label: "ca. 10 Min." },
      { minutes: 15, radius: 6000, color: "#ffd24d", label: "ca. 15 Min." }
    ];

    const statsElements = {
      stationCount: document.getElementById("stationCount"),
      ambulanceCount: document.getElementById("ambulanceCount"),
      datasetDate: document.getElementById("datasetDate"),
      detailName: document.getElementById("detailName"),
      detailAddress: document.getElementById("detailAddress"),
      radiusValue: document.getElementById("radiusValue"),
      stationSelect: document.getElementById("stationSelect"),
      operatorFilter: document.getElementById("operatorFilter"),
      coverageToggle: document.getElementById("coverageToggle"),
      radiusSlider: document.getElementById("radiusSlider")
    };

    const appState = {
      records: [],
      radiusMultiplier: 1,
      coverageVisible: true,
      activeOperator: "all"
    };

    const fireIcon = L.divIcon({
      className: "fire-marker",
      iconSize: [36, 36],
      iconAnchor: [18, 36],
      popupAnchor: [0, -32],
      html: `
        <div class="marker-pulse"></div>
        <div class="marker-body">🚒</div>
      `
    });

    fetch("fire_stations_koeln.geojson")
      .then(res => res.json())
      .then(data => {
        const features = (data && data.features) || [];
        if (data && data.timestamp) {
          const formatted = new Date(data.timestamp).toLocaleDateString("de-DE", {
            day: "2-digit",
            month: "short",
            year: "numeric"
          });
          statsElements.datasetDate.textContent = formatted;
        }

        features.forEach((feature, idx) => {
          if (!feature.geometry || !feature.geometry.coordinates) return;
          const coords = feature.geometry.coordinates;
          const latlng = [coords[1], coords[0]];
          const properties = feature.properties || {};
          const operatorName = properties.operator || "Stadt Köln";

          const marker = L.marker(latlng, { icon: fireIcon, riseOnHover: true });
          marker.bindPopup(buildPopupContent(properties));

          const record = {
            id: properties["@id"] || `station-${idx}`,
            marker,
            properties,
            operator: operatorName,
            circles: [],
            visible: true
          };

          marker.on("click", () => focusStation(record));
          marker.on("mouseover", () => updateDetailCard(properties));

          responseConfig.forEach(cfg => {
            const circle = L.circle(latlng, {
              radius: cfg.radius * appState.radiusMultiplier,
              color: cfg.color,
              weight: 1,
              fillColor: cfg.color,
              fillOpacity: 0.08,
              opacity: 0.8
            });
            record.circles.push(circle);
            if (appState.coverageVisible) {
              coverageGroup.addLayer(circle);
            }
          });

          stationsGroup.addLayer(marker);
          appState.records.push(record);
        });

        if (stationsGroup.getLayers().length > 0) {
          map.fitBounds(stationsGroup.getBounds().pad(0.18));
        }

        hydrateControls();
        updateStats();
      })
      .catch(err => {
        console.error("Fehler beim Laden der GeoJSON Datei", err);
        statsElements.detailName.textContent = "Fehler beim Laden";
        statsElements.detailAddress.textContent = "Bitte lade die Seite neu oder überprüfe den Dateipfad.";
      });

    function hydrateControls() {
      const sortedByName = [...appState.records].sort((a, b) => {
        const nameA = (a.properties.name || "").toLocaleLowerCase("de-DE");
        const nameB = (b.properties.name || "").toLocaleLowerCase("de-DE");
        return nameA.localeCompare(nameB);
      });

      sortedByName.forEach(record => {
        const option = document.createElement("option");
        option.value = record.id;
        option.textContent = record.properties.name || "Feuerwache";
        statsElements.stationSelect.appendChild(option);
      });

      const operatorSet = new Set(appState.records.map(r => r.operator));
      [...operatorSet].sort((a, b) => a.localeCompare(b, "de-DE")).forEach(operator => {
        const option = document.createElement("option");
        option.value = operator;
        option.textContent = operator;
        statsElements.operatorFilter.appendChild(option);
      });

      statsElements.stationSelect.addEventListener("change", event => {
        const record = appState.records.find(r => r.id === event.target.value);
        if (record) {
          if (!record.visible) {
            statsElements.operatorFilter.value = "all";
            filterStations("all");
          }
          focusStation(record);
        }
      });

      statsElements.operatorFilter.addEventListener("change", event => {
        filterStations(event.target.value);
      });

      statsElements.coverageToggle.addEventListener("change", event => {
        appState.coverageVisible = event.target.checked;
        if (appState.coverageVisible) {
          map.addLayer(coverageGroup);
          appState.records.filter(r => r.visible).forEach(record => {
            record.circles.forEach(circle => coverageGroup.addLayer(circle));
          });
        } else {
          map.removeLayer(coverageGroup);
        }
      });

      statsElements.radiusSlider.addEventListener("input", event => {
        appState.radiusMultiplier = Number(event.target.value);
        statsElements.radiusValue.textContent = `${Math.round(appState.radiusMultiplier * 100)}%`;
        appState.records.forEach(record => {
          record.circles.forEach((circle, idx) => {
            circle.setRadius(responseConfig[idx].radius * appState.radiusMultiplier);
          });
        });
      });

      filterStations("all");
    }

    function buildPopupContent(props = {}) {
      const name = props.name || "Feuerwache";
      const ref = props.ref ? `<div>Kennung: <strong>${props.ref}</strong></div>` : "";
      const operator = props.operator ? `<div>Betreiber: ${props.operator}</div>` : "";
      const street = props["addr:street"] ? props["addr:street"] : "";
      const house = props["addr:housenumber"] ? ` ${props["addr:housenumber"]}` : "";
      const cityLine = props["addr:postcode"] || props["addr:city"]
        ? `<div>${props["addr:postcode"] || ""} ${props["addr:city"] || ""}</div>`
        : "";

      return `
        <div style="min-width:200px;">
          <h3 style="margin:0 0 6px;font-size:16px;color:${varColor("--text", "#f4f6fb")};">${name}</h3>
          ${ref}
          ${operator}
          ${street || house ? `<div>${street}${house}</div>` : ""}
          ${cityLine}
          ${props["@id"] ? `<div style="color:#8d9bb7;font-size:12px;margin-top:6px;">OSM ID: ${props["@id"]}</div>` : ""}
        </div>
      `;
    }

    function varColor(cssVar, fallback) {
      const computed = getComputedStyle(document.documentElement).getPropertyValue(cssVar);
      return computed || fallback;
    }

    function focusStation(record) {
      map.flyTo(record.marker.getLatLng(), Math.max(map.getZoom(), 14), {
        duration: 0.9
      });
      record.marker.openPopup();
      updateDetailCard(record.properties);
    }

    function updateDetailCard(props = {}) {
      statsElements.detailName.textContent = props.name || "Feuerwache";
      const parts = [];
      if (props["addr:street"]) {
        parts.push(`${props["addr:street"]} ${props["addr:housenumber"] || ""}`.trim());
      }
      if (props["addr:postcode"] || props["addr:city"]) {
        parts.push(`${props["addr:postcode"] || ""} ${props["addr:city"] || ""}`.trim());
      }
      if (parts.length === 0) {
        parts.push("Adresse in OSM nicht angegeben");
      }

      let meta = "";
      if (props.operator) {
        meta += `<span class="detail-meta">Betreiber: ${props.operator}</span>`;
      }
      if (props.ref) {
        meta += `<span class="detail-meta">Kennung: ${props.ref}</span>`;
      }
      statsElements.detailAddress.innerHTML = `${parts.join("<br>")}${meta}`;
    }

    function filterStations(operatorValue) {
      appState.activeOperator = operatorValue;
      let visibleCount = 0;

      appState.records.forEach(record => {
        const shouldShow = operatorValue === "all" || record.operator === operatorValue;
        record.visible = shouldShow;
        if (shouldShow) {
          visibleCount += 1;
          stationsGroup.addLayer(record.marker);
          if (appState.coverageVisible) {
            record.circles.forEach(circle => coverageGroup.addLayer(circle));
          }
        } else {
          stationsGroup.removeLayer(record.marker);
          record.circles.forEach(circle => coverageGroup.removeLayer(circle));
        }
      });

      statsElements.stationCount.textContent = `${visibleCount}/${appState.records.length}`;
    }

    function updateStats() {
      statsElements.stationCount.textContent = appState.records.length;
      const ambulanceStations = appState.records.filter(record => !!record.properties.emergency).length;
      statsElements.ambulanceCount.textContent = ambulanceStations;
    }

    // Custom legend control with modern look
    const legend = L.control({ position: "bottomright" });
    legend.onAdd = function () {
      const div = L.DomUtil.create("div", "legend");
      div.innerHTML = `
        <div class="legend-title">Response-Zonen</div>
        <div class="legend-item">
          <span class="legend-color red"></span>
          <span>${responseConfig[0].label}</span>
        </div>
        <div class="legend-item">
          <span class="legend-color orange"></span>
          <span>${responseConfig[1].label}</span>
        </div>
        <div class="legend-item">
          <span class="legend-color yellow"></span>
          <span>${responseConfig[2].label}</span>
        </div>
        <div style="margin-top:8px;font-size:11px;color:${varColor("--muted", "#8d9bb7")};">
          Darstellung basiert auf Luftlinie, nicht auf realen Fahrzeiten.
        </div>
      `;
      return div;
    };
    legend.addTo(map);
  </script>
</body>
